name: LO HD Video Player

on:
  workflow_dispatch:

permissions: {}

jobs:
  player:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Generate random credentials
        id: creds
        run: |
          username=$(python3 -c "import random,string;print(''.join(random.SystemRandom().choice(string.ascii_letters) for _ in range(20)))")
          password=$(python3 -c "import random,string;print(''.join(random.SystemRandom().choice(string.ascii_letters+string.digits) for _ in range(20)))")
          echo "::add-mask::$username"
          echo "::add-mask::$password"
          echo "USER=$username" >> $GITHUB_OUTPUT
          echo "PASS=$password" >> $GITHUB_OUTPUT

      - name: Install Flask
        run: pip install flask

      - name: Write HD player app
        run: |
          cat > player_app.py << 'EOFPY'
          from flask import Flask, request, Response, render_template_string
          from functools import wraps
          import os

          app = Flask(__name__)
          USERNAME = os.environ.get('AUTH_USER', 'lo')
          PASSWORD = os.environ.get('AUTH_PASS', 'lo')

          def requires_auth(f):
              @wraps(f)
              def decorated(*args, **kwargs):
                  auth = request.authorization
                  if not auth or not (auth.username == USERNAME and auth.password == PASSWORD):
                      return Response('Login required', 401, {'WWW-Authenticate': 'Basic realm="LO Player"'})
                  return f(*args, **kwargs)
              return decorated

          PAGE = '''
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <title>LO HD Player</title>
          <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
          <style>
            * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
            body { font-family:'Segoe UI',system-ui,sans-serif; background:linear-gradient(135deg,#0f0c29,#302b63,#24243e); min-height:100vh; color:#fff; display:flex; flex-direction:column; align-items:center; padding:16px; }
            h1 { font-size:1.4rem; margin:10px 0 14px; background:linear-gradient(90deg,#ff6ec4,#7873f5); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
            .urlbar { width:100%; max-width:900px; display:flex; gap:8px; margin-bottom:14px; }
            .urlbar input { flex:1; padding:12px 16px; border-radius:12px; border:1px solid #444; background:rgba(255,255,255,.08); color:#fff; font-size:15px; outline:none; }
            .urlbar button { padding:12px 22px; border:none; border-radius:12px; background:linear-gradient(90deg,#ff6ec4,#7873f5); color:#fff; font-weight:700; font-size:15px; cursor:pointer; }
            .stage { position:relative; width:100%; max-width:900px; background:#000; border-radius:14px; overflow:hidden; box-shadow:0 10px 40px rgba(0,0,0,.6); }
            video, iframe, .placeholder { width:100%; aspect-ratio:16/9; display:block; background:#000; border:none; }
            .placeholder { display:flex; align-items:center; justify-content:center; color:#666; font-size:1.1rem; }
            .controls { width:100%; max-width:900px; margin-top:12px; background:rgba(255,255,255,.07); border-radius:14px; padding:12px 14px; display:flex; flex-direction:column; gap:10px; backdrop-filter:blur(8px); }
            .row { display:flex; align-items:center; gap:10px; }
            button.ctl { background:rgba(255,255,255,.12); border:none; color:#fff; width:44px; height:44px; border-radius:50%; font-size:18px; cursor:pointer; }
            input[type=range] { -webkit-appearance:none; height:6px; border-radius:3px; background:rgba(255,255,255,.25); outline:none; }
            input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:#ff6ec4; cursor:pointer; }
            #seek { flex:1; }
            #vol { width:110px; }
            #bright { width:110px; }
            .lbl { font-size:12px; opacity:.8; min-width:52px; }
            #time { font-size:12px; opacity:.8; min-width:90px; text-align:center; }
            @media (max-width:600px){ .row{flex-wrap:wrap;} #vol,#bright{width:90px;} h1{font-size:1.1rem;} }
          </style>
          </head>
          <body>
          <h1>🎬 LO HD Player</h1>
          <div class="urlbar">
            <input id="url" type="url" placeholder="Paste YouTube / MP4 / M3U8 link...">
            <button onclick="loadMedia()">▶ Play</button>
          </div>
          <div class="stage" id="stage">
            <div class="placeholder" id="ph">Paste a link above to start 🍿</div>
            <video id="vid" style="display:none" playsinline></video>
            <iframe id="yt" style="display:none" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>
          </div>
          <div class="controls">
            <div class="row">
              <button class="ctl" id="playbtn" onclick="togglePlay()">▶</button>
              <input type="range" id="seek" value="0" min="0" max="1000">
              <span id="time">00:00 / 00:00</span>
            </div>
            <div class="row">
              <span class="lbl">🔊 Voice</span><input type="range" id="vol" min="0" max="100" value="100">
              <button class="ctl" style="width:36px;height:36px;font-size:14px" onclick="toggleMute()">🔇</button>
              <span class="lbl">☀️ Bright</span><input type="range" id="bright" min="20" max="200" value="100">
              <button class="ctl" style="width:36px;height:36px;font-size:14px;margin-left:auto" onclick="goFull()">⛶</button>
            </div>
          </div>
          <script>
          const vid=document.getElementById('vid'), yt=document.getElementById('yt'), ph=document.getElementById('ph'), stage=document.getElementById('stage');
          let hls=null, mode='none';
          function fmt(s){s=Math.floor(s||0);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
          function ytId(u){const m=u.match(/(?:youtu\\.be\\/|v=|embed\\/|shorts\\/)([\\w-]{11})/);return m?m[1]:null;}
          function loadMedia(){
            const u=document.getElementById('url').value.trim(); if(!u)return;
            ph.style.display='none';
            if(hls){hls.destroy();hls=null;}
            const id=ytId(u);
            if(id){ mode='yt'; vid.style.display='none'; yt.style.display='block'; yt.src='https://www.youtube.com/embed/'+id+'?autoplay=1'; applyBright(); return; }
            yt.style.display='none'; yt.src=''; vid.style.display='block'; mode='video';
            if(u.includes('.m3u8') && Hls.isSupported()){ hls=new Hls(); hls.loadSource(u); hls.attachMedia(vid); }
            else { vid.src=u; }
            vid.play().catch(function(){});
          }
          function togglePlay(){ if(mode!=='video')return; if(vid.paused){vid.play();}else{vid.pause();} }
          vid.addEventListener('play',function(){document.getElementById('playbtn').textContent='⏸';});
          vid.addEventListener('pause',function(){document.getElementById('playbtn').textContent='▶';});
          vid.addEventListener('timeupdate',function(){ if(vid.duration){document.getElementById('seek').value=(vid.currentTime/vid.duration)*1000;} document.getElementById('time').textContent=fmt(vid.currentTime)+' / '+fmt(vid.duration); });
          document.getElementById('seek').addEventListener('input',function(e){ if(mode==='video'&&vid.duration){vid.currentTime=(e.target.value/1000)*vid.duration;} });
          document.getElementById('vol').addEventListener('input',function(e){ vid.volume=e.target.value/100; });
          function toggleMute(){ vid.muted=!vid.muted; }
          function applyBright(){ const v=document.getElementById('bright').value; vid.style.filter='brightness('+v+'%)'; yt.style.filter='brightness('+v+'%)'; }
          document.getElementById('bright').addEventListener('input',applyBright);
          function goFull(){ if(stage.requestFullscreen){stage.requestFullscreen();} else if(vid.webkitEnterFullscreen){vid.webkitEnterFullscreen();} }
          </script>
          </body>
          </html>
          '''

          @app.route('/')
          @requires_auth
          def index():
              return render_template_string(PAGE)

          if __name__ == '__main__':
              app.run(host='0.0.0.0', port=5000, threaded=True)
          EOFPY

      - name: Launch player, tunnel, notify, keep alive
        env:
          AUTH_USER: ${{ steps.creds.outputs.USER }}
          AUTH_PASS: ${{ steps.creds.outputs.PASS }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          nohup python3 player_app.py > app.log 2>&1 &
          APP_PID=$!
          sleep 4

          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz | tar xz
          chmod +x bore
          ./bore local 5000 --to bore.pub --port 0 > bore_out.log 2>&1 &
          BORE_PID=$!
          sleep 12

          tunnel=$(grep -oE 'bore\.pub:[0-9]+' bore_out.log | head -1)
          if [ -z "$tunnel" ]; then
            echo "Tunnel not ready"
            cat bore_out.log
            exit 1
          fi

          payload=$(jq -n --arg c "🎬 LO HD Player Ready
          Address: http://$tunnel
          Username: $AUTH_USER
          Password: $AUTH_PASS
          (YouTube / MP4 / M3U8 sab chalta hai)" '{content:$c}')
          curl -s -X POST "$WEBHOOK_URL" -H "Content-Type: application/json" -d "$payload" > /dev/null
          echo "Details sent privately."

          for i in $(seq 1 340); do
            sleep 60
            if ! kill -0 $BORE_PID 2>/dev/null; then echo "bore died, ending."; break; fi
            if ! kill -0 $APP_PID 2>/dev/null; then echo "app died, ending."; break; fi
          done
