name: LO Ultra Secure Android + Virtual Camera

on:
  workflow_dispatch:

permissions: {}

jobs:
  android:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Generate random credentials
        id: creds
        shell: pwsh
        run: |
          $username = -join ((97..122) + (65..90) | Get-Random -Count 20 | ForEach-Object {[char]$_})
          $password = -join ((65..90) + (97..122) + (48..57) | Get-Random -Count 20 | ForEach-Object {[char]$_})
          
          Write-Output "::add-mask::$username"
          Write-Output "::add-mask::$password"
          
          Add-Content -Path $env:GITHUB_OUTPUT -Value "USER=$username"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "PASS=$password"
          
          Write-Host "Random credentials generated"

      - name: Enable RDP with NLA
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 1

      - name: Create admin user
        shell: pwsh
        run: |
          $username = "${{ steps.creds.outputs.USER }}"
          $password = "${{ steps.creds.outputs.PASS }}"
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $username -Password $secure
          Add-LocalGroupMember -Group Administrators -Member $username

      - name: Install Chocolatey
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
          Invoke-Expression ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))

      - name: Install Android emulator and OBS
        shell: pwsh
        run: |
          choco install bluestacks -y
          choco install obs-studio -y
          choco install vlc -y

      - name: Download sample video for virtual camera
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "C:\VirtualCam" -Force
          Invoke-WebRequest -Uri "https://sample-videos.com/video321/mp4/720/big_buck_bunny_720p_1mb.mp4" -OutFile "C:\VirtualCam\sample.mp4"
          
          # Create a test image
          Add-Type -AssemblyName System.Drawing
          $bitmap = New-Object System.Drawing.Bitmap(640,480)
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.Clear([System.Drawing.Color]::Blue)
          $font = New-Object System.Drawing.Font("Arial", 24)
          $brush = [System.Drawing.Brushes]::White
          $graphics.DrawString("LO Virtual Camera", $font, $brush, 100, 200)
          $bitmap.Save("C:\VirtualCam\test.jpg")
          $graphics.Dispose()
          $bitmap.Dispose()

      - name: Create virtual camera setup script
        shell: pwsh
        run: |
          $script = @'
          # OBS Virtual Camera Setup
          Write-Host "Setting up OBS Virtual Camera..."
          
          # Start OBS with virtual camera
          Start-Process "C:\Program Files\obs-studio\bin\64bit\obs64.exe" -ArgumentList "--startvirtualcam"
          Start-Sleep -Seconds 5
          
          # Instructions for user
          @"
          === VIRTUAL CAMERA SETUP ===
          
          1. OBS Virtual Camera is now active
          
          2. To use a VIDEO as camera:
             - Open VLC
             - Play your video file
             - In OBS: Sources > Add > VLC Video Source
             - Select your video file
             - Click "Start Virtual Camera"
          
          3. To use an IMAGE as camera:
             - In OBS: Sources > Add > Image
             - Select your image file (C:\VirtualCam\test.jpg)
             - Click "Start Virtual Camera"
          
          4. BlueStacks will now use this virtual camera
          
          Sample files available:
          - Video: C:\VirtualCam\sample.mp4
          - Image: C:\VirtualCam\test.jpg
          
          === ANDROID SETUP ===
          
          BlueStacks is installed. Launch it and:
          1. Sign in with Google account
          2. Install any apps from Play Store
          3. For apps that use camera, select "OBS Virtual Camera"
          
          "@ | Out-File -FilePath "C:\VirtualCam\INSTRUCTIONS.txt"
          
          Write-Host "Setup complete! Check C:\VirtualCam\INSTRUCTIONS.txt"
          '@
          
          $script | Out-File -FilePath "C:\VirtualCam\setup.ps1" -Encoding UTF8

      - name: Create auto-start script
        shell: pwsh
        run: |
          $autostart = @'
          Write-Host "Starting Android + Virtual Camera environment..."
          
          # Start BlueStacks
          Start-Process "C:\Program Files\BlueStacks_nxt\HD-Player.exe"
          Start-Sleep -Seconds 10
          
          # Start OBS with virtual camera
          Start-Process "C:\Program Files\obs-studio\bin\64bit\obs64.exe" -ArgumentList "--startvirtualcam"
          
          # Open instructions
          Start-Process "C:\VirtualCam\INSTRUCTIONS.txt"
          
          Write-Host "Environment ready! Connect via RDP to use."
          Write-Host "Username: $env:USERNAME"
          Write-Host "Check INSTRUCTIONS.txt for virtual camera setup"
          '@
          
          $autostart | Out-File -FilePath "C:\VirtualCam\start.ps1" -Encoding UTF8

      - name: Start bore tunnel
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-pc-windows-msvc.zip' -OutFile bore.zip -UseBasicParsing
          Expand-Archive bore.zip -DestinationPath ./bore
          $exe = Join-Path $PWD 'bore/bore.exe'
          
          Start-Process -FilePath $exe -ArgumentList 'local','3389','--to','bore.pub','--port','0' -RedirectStandardOutput "$PWD/bore_out.log" -RedirectStandardError "$PWD/bore_err.log" -NoNewWindow
          Start-Sleep -Seconds 10

      - name: Get tunnel and notify
        shell: pwsh
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          USERNAME: ${{ steps.creds.outputs.USER }}
          PASSWORD: ${{ steps.creds.outputs.PASS }}
        run: |
          $tunnel = $null
          for ($i = 1; $i -le 12; $i++) {
            if (Test-Path "$PWD/bore_out.log") {
              $log = Get-Content "$PWD/bore_out.log" -Raw
              if ($log -match 'listening at bore\.pub:(\d+)') {
                $port = $matches[1]
                $tunnel = "bore.pub:$port"
                break
              }
            }
            Start-Sleep -Seconds 5
          }
          
          if (-not $tunnel) {
            Write-Host "Tunnel not ready"
            if (Test-Path "$PWD/bore_out.log") { Get-Content "$PWD/bore_out.log" }
            exit 1
          }
          
          $message = "📱 LO Android + Virtual Camera Ready`n`nAddress: $tunnel`nUsername: $env:USERNAME`nPassword: $env:PASSWORD`n`nFeatures:`n✅ Android (BlueStacks)`n✅ All Play Store apps`n✅ Virtual Camera (OBS)`n✅ Stream video/image as camera`n`nAfter RDP connect:`n1. Run: C:\VirtualCam\start.ps1`n2. Read: C:\VirtualCam\INSTRUCTIONS.txt"
          
          $body = @{ content = $message } | ConvertTo-Json
          Invoke-RestMethod -Uri $env:WEBHOOK_URL -Method Post -Body $body -ContentType 'application/json' | Out-Null
          Write-Host "Credentials sent privately"

      - name: Keep alive
        run: |
          for ($i = 0; $i -lt 340; $i++) {
            Start-Sleep -Seconds 60
            if (-not (Get-Process -Name bore -ErrorAction SilentlyContinue)) { Write-Host "bore died"; break }
          }
