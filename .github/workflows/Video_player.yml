name: LO Ultra Secure Android Phone

on:
  workflow_dispatch:

permissions: {}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Generate random credentials
        id: creds
        shell: bash
        run: |
          username=$(cat /dev/urandom | tr -dc 'a-zA-Z' | fold -w 20 | head -n 1)
          password=$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | fold -w 20 | head -n 1)
          
          echo "::add-mask::$username"
          echo "::add-mask::$password"
          
          echo "USER=$username" >> $GITHUB_OUTPUT
          echo "PASS=$password" >> $GITHUB_OUTPUT

      - name: Enable KVM (if available) and Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils
          sudo usermod -aG kvm $USER
          sudo usermod -aG libvirt $USER
          
          # Pull Redroid (Remote Android) - Android 11, lightweight
          docker pull redroid/redroid:11.0.0-latest

      - name: Start Android container
        run: |
          docker run -itd \
            --name android_phone \
            --privileged \
            -p 5555:5555 \
            -p 8000:8000 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_gpu=0 \
            androidboot.redroid_fps=30

      - name: Install scrcpy-web (browser interface)
        run: |
          # Install adb
          sudo apt-get install -y adb
          
          # Wait for Android to boot
          sleep 30
          adb connect localhost:5555
          adb wait-for-device
          sleep 10
          
          # Install scrcpy-web (browser-based Android control)
          npm install -g ws-scrcpy
          
          # Start web interface
          npx ws-scrcpy --port 8000 &

      - name: Setup virtual camera
        run: |
          # Install v4l2loopback for virtual camera
          sudo apt-get install -y v4l2loopback-utils v4l2loopback-dkms ffmpeg
          
          # Create virtual camera device
          sudo modprobe v4l2loopback devices=1 video_nr=10 card_label="LO Virtual Camera"
          
          # Wait for device
          sleep 3
          
          # Create a sample image to stream (you can replace this URL)
          wget -O sample_image.jpg "https://picsum.photos/1280/720"
          
          # Start FFmpeg to loop the image as camera feed
          ffmpeg -re -loop 1 -i sample_image.jpg \
            -f v4l2 -vcodec rawvideo -pix_fmt yuv420p /dev/video10 &
          
          # Inject virtual camera into Android
          adb shell "su -c 'mount --bind /dev/video10 /dev/video0'" || echo "Virtual camera injection attempted"

      - name: Install popular apps
        run: |
          # Download and install some popular APKs
          mkdir apps
          cd apps
          
          # Install apps via adb (these are safe, open-source or official APKs)
          wget -O f-droid.apk "https://f-droid.org/F-Droid.apk" || true
          wget -O newpipe.apk "https://github.com/TeamNewPipe/NewPipe/releases/download/v0.27.2/NewPipe_v0.27.2.apk" || true
          
          # Install downloaded apps
          for apk in *.apk; do
            if [ -f "$apk" ]; then
              adb install "$apk" || echo "Failed to install $apk"
            fi
          done
          
          echo "Apps installation attempted"

      - name: Create authentication proxy
        run: |
          cat > auth_proxy.py << 'EOFPY'
          from flask import Flask, Response, request
          from functools import wraps
          import requests
          import os

          app = Flask(__name__)

          USERNAME = os.environ.get('AUTH_USER')
          PASSWORD = os.environ.get('AUTH_PASS')

          def check_auth(username, password):
              return username == USERNAME and password == PASSWORD

          def authenticate():
              return Response('Authentication required', 401, {
                  'WWW-Authenticate': 'Basic realm="Login Required"'
              })

          def requires_auth(f):
              @wraps(f)
              def decorated(*args, **kwargs):
                  auth = request.authorization
                  if not auth or not check_auth(auth.username, auth.password):
                      return authenticate()
                  return f(*args, **kwargs)
              return decorated

          @app.route('/')
          @requires_auth
          def index():
              return '''
              <!DOCTYPE html>
              <html>
              <head>
                  <title>📱 LO Private Android</title>
                  <style>
                      body { margin: 0; padding: 0; overflow: hidden; }
                      iframe { width: 100vw; height: 100vh; border: none; }
                  </style>
              </head>
              <body>
                  <iframe src="/scrcpy"></iframe>
              </body>
              </html>
              '''

          @app.route('/scrcpy')
          @requires_auth
          def scrcpy():
              return redirect('http://localhost:8000')

          if __name__ == '__main__':
              app.run(host='0.0.0.0', port=9000)
          EOFPY

          pip install flask requests
          AUTH_USER=${{ steps.creds.outputs.USER }} AUTH_PASS=${{ steps.creds.outputs.PASS }} python auth_proxy.py &

      - name: Start bore tunnel
        run: |
          curl -L https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz | tar xz
          chmod +x bore
          ./bore local 9000 --to bore.pub --port 0 > bore_out.log 2>&1 &
          sleep 20

      - name: Get tunnel and notify
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          USERNAME: ${{ steps.creds.outputs.USER }}
          PASSWORD: ${{ steps.creds.outputs.PASS }}
        run: |
          tunnel=$(grep -o 'bore.pub:[0-9]*' bore_out.log | head -1)
          
          if [ -z "$tunnel" ]; then
            echo "Tunnel not ready"
            cat bore_out.log
            exit 1
          fi
          
          message="📱 LO Private Android Phone Ready`nAddress: http://$tunnel`nUsername: $USERNAME`nPassword: $PASSWORD`nAndroid: 11.0 (Redroid)`nVirtual Camera: Active`nControl: Browser-based (scrcpy)"
          
          curl -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"$message\"}"
          
          echo "Android phone details sent"

      - name: Keep alive
        run: |
          sleep 20400
