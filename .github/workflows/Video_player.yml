name: LO OpenClaw Fortress

on:
  workflow_dispatch:

permissions: {}

jobs:
  openclaw:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: OpenClaw + backend-verified auth gate + bore tunnel
        shell: pwsh
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WEBHOOK_URL)) { Write-Host "Missing webhook"; exit 1 }

          $username = -join ((97..122) + (65..90) | Get-Random -Count 20 | ForEach-Object {[char]$_})
          $password = -join ((65..90) + (97..122) + (48..57) | Get-Random -Count 20 | ForEach-Object {[char]$_})
          Write-Output "::add-mask::$username"
          Write-Output "::add-mask::$password"

          Add-MpPreference -ExclusionPath $PWD -ErrorAction SilentlyContinue

          # ---------- 1) OpenClaw (localhost only) ----------
          Write-Host "Installing OpenClaw..."
          npm install -g openclaw *> npm_install.log

          Start-Process -FilePath 'cmd.exe' -ArgumentList '/c','openclaw gateway --port 18789 > oc_out.log 2> oc_err.log' -NoNewWindow -WorkingDirectory "$PWD"

          $ocReady = $false
          for ($i = 1; $i -le 20; $i++) {
            try {
              $null = Invoke-WebRequest -Uri 'http://127.0.0.1:18789' -TimeoutSec 3 -UseBasicParsing
              $ocReady = $true; break
            } catch {
              if ($_.Exception.Response) { $ocReady = $true; break }
            }
            Start-Sleep -Seconds 3
          }
          if (-not $ocReady) {
            Start-Process -FilePath 'cmd.exe' -ArgumentList '/c','openclaw gateway --allow-unconfigured > oc_out2.log 2> oc_err2.log' -NoNewWindow -WorkingDirectory "$PWD"
            for ($i = 1; $i -le 20; $i++) {
              try {
                $null = Invoke-WebRequest -Uri 'http://127.0.0.1:18789' -TimeoutSec 3 -UseBasicParsing
                $ocReady = $true; break
              } catch {
                if ($_.Exception.Response) { $ocReady = $true; break }
              }
              Start-Sleep -Seconds 3
            }
          }
          if (-not $ocReady) {
            Write-Host "OpenClaw not listening. Debug:"
            foreach ($f in @('npm_install.log','oc_err.log','oc_err2.log')) {
              if (Test-Path "$PWD\$f") { Write-Host "=== $f ==="; Get-Content "$PWD\$f" -Tail 25 }
            }
            exit 1
          }
          Write-Host "OpenClaw listening on 127.0.0.1:18789 (localhost only)"

          # ---------- 2) Caddy: server-side bcrypt auth + TLS ----------
          Invoke-WebRequest -Uri 'https://github.com/caddyserver/caddy/releases/download/v2.9.1/caddy_2.9.1_windows_amd64.zip' -OutFile caddy.zip -UseBasicParsing
          Expand-Archive caddy.zip -DestinationPath ./caddy
          $caddy = "$PWD\caddy\caddy.exe"

          $hash = (& $caddy hash-password --plaintext $password) 2>$null | Select-Object -Last 1
          $hash = "$hash".Trim()

          $lines = @(
            '{',
            "`tadmin off",
            '}',
            'https://127.0.0.1:8090 {',
            "`ttls internal",
            "`tbasicauth {",
            "`t`t$username $hash",
            "`t}",
            "`treverse_proxy 127.0.0.1:18789",
            '}'
          )
          Set-Content -Path "$PWD\Caddyfile" -Value ($lines -join "`n")

          Start-Process -FilePath $caddy -ArgumentList 'run','--config',"$PWD\Caddyfile" -RedirectStandardOutput "$PWD\caddy_out.log" -RedirectStandardError "$PWD\caddy_err.log" -NoNewWindow
          Start-Sleep -Seconds 6
          if (-not (Get-Process -Name caddy -ErrorAction SilentlyContinue)) {
            Write-Host "Caddy failed. Debug:"
            Get-Content "$PWD\caddy_err.log" -Tail 30
            exit 1
          }

          # ---------- 3) bore.pub TCP tunnel ----------
          Invoke-WebRequest -Uri 'https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-pc-windows-msvc.zip' -OutFile bore.zip -UseBasicParsing
          Expand-Archive bore.zip -DestinationPath ./bore
          Start-Process -FilePath "$PWD\bore\bore.exe" -ArgumentList 'local','8090','--to','bore.pub','--port','0' -RedirectStandardOutput "$PWD\bore_out.log" -RedirectStandardError "$PWD\bore_err.log" -NoNewWindow

          $url = $null
          for ($i = 1; $i -le 24; $i++) {
            foreach ($f in @('bore_out.log','bore_err.log')) {
              if (Test-Path "$PWD\$f") {
                $log = Get-Content "$PWD\$f" -Raw
                if ($log -match 'listening at bore\.pub:(\d+)') { $url = "https://bore.pub:$($matches[1])"; break }
              }
            }
            if ($url) { break }
            Start-Sleep -Seconds 5
          }
          if (-not $url) {
            Write-Host "Bore tunnel not ready. Debug:"
            foreach ($f in @('bore_out.log','bore_err.log')) { if (Test-Path "$PWD\$f") { Get-Content "$PWD\$f" -Tail 25 } }
            exit 1
          }

          # ---------- 4) Discord ----------
          $message = "LO OpenClaw Fortress Ready 🔒`nURL: $url`nUsername: $username`nPassword: $password`nNote: cert warning aayega - Advanced > Proceed karo (yehi TLS encryption ki daleel hai)."
          $body = @{ content = $message } | ConvertTo-Json
          Invoke-RestMethod -Uri $env:WEBHOOK_URL -Method Post -Body $body -ContentType 'application/json' | Out-Null
          Write-Host "Access sent privately."

          # ---------- 5) keep alive ----------
          for ($i = 0; $i -lt 340; $i++) {
            Start-Sleep -Seconds 60
            $alive = (Get-Process -Name bore -ErrorAction SilentlyContinue) -and (Get-Process -Name caddy -ErrorAction SilentlyContinue)
            if (-not $alive) { Write-Host "Tunnel/proxy died, ending."; break }
          }
