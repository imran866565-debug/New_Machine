name: Debug Check Files

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Restore and check files
        shell: bash
        run: |
          echo "=== Checking GOOGLE_SERVICES_B64 ==="
          B64_LENGTH=${#{{ secrets.GOOGLE_SERVICES_B64 }}}
          echo "Base64 length: $B64_LENGTH characters"
          
          if [ "$B64_LENGTH" -lt 10 ]; then
            echo "ERROR: Base64 string bahut chota hai - shayad empty ya wrong secret"
            exit 1
          fi
          
          echo "${{ secrets.GOOGLE_SERVICES_B64 }}" | base64 -d > google-services.json
          
          echo "=== File size ==="
          ls -lh google-services.json
          
          echo "=== First 5 lines ==="
          head -n 5 google-services.json
          
          echo "=== Checking for project_info ==="
          if grep -q "project_info" google-services.json; then
            echo "✅ project_info found"
          else
            echo "❌ project_info NOT found - file invalid hai"
          fi
          
          echo "=== Checking JSON validity ==="
          if jq empty google-services.json 2>/dev/null; then
            echo "✅ Valid JSON"
          else
            echo "❌ Invalid JSON - file corrupt hai"
            cat google-services.json
          fi
