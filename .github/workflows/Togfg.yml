name: Check Secret Content

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Analyze secret safely
        shell: bash
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_B64 }}
        run: |
          echo "=== Secret Analysis ==="
          echo "Length: ${#GOOGLE_SERVICES_B64} characters"
          
          if [ ${#GOOGLE_SERVICES_B64} -eq 0 ]; then
            echo "❌ Secret khali hai - kuch paste nahi kiya"
            exit 1
          fi
          
          if [ ${#GOOGLE_SERVICES_B64} -lt 100 ]; then
            echo "❌ Secret bahut chota hai - shayad galat content paste kiya"
            echo "Pehle 50 characters: ${GOOGLE_SERVICES_B64:0:50}"
            exit 1
          fi
          
          echo "First 50 chars: ${GOOGLE_SERVICES_B64:0:50}..."
          echo "Last 50 chars: ...${GOOGLE_SERVICES_B64: -50}"
          
          echo ""
          echo "=== Attempting decode ==="
          echo "$GOOGLE_SERVICES_B64" | base64 -d > test.json 2>decode_error.txt
          
          if [ $? -ne 0 ]; then
            echo "❌ Base64 decode fail - invalid base64 string"
            cat decode_error.txt
            exit 1
          fi
          
          echo "Decoded file size: $(wc -c < test.json) bytes"
          
          if [ ! -s test.json ]; then
            echo "❌ Decoded file khali hai"
            exit 1
          fi
          
          echo ""
          echo "=== First 200 chars of decoded file ==="
          head -c 200 test.json
          echo ""
          echo "=== End of preview ==="
          
          echo ""
          echo "=== Checking JSON structure ==="
          if grep -q "project_info" test.json; then
            echo "✅ project_info found"
          else
            echo "❌ project_info NOT found"
            echo "File content preview:"
            cat test.json | head -c 500
          fi
