name: LO Ultra Secure RDP (Telegram Private Channel)

on:
  workflow_dispatch:

permissions: {}

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Create random admin credentials
        id: creds
        shell: pwsh
        run: |
          $username = -join ((97..122) + (65..90) | Get-Random -Count 20 | ForEach-Object {[char]$_})
          $password = -join ((65..90) + (97..122) + (48..57) | Get-Random -Count 20 | ForEach-Object {[char]$_})
          
          Write-Output "::add-mask::$username"
          Write-Output "::add-mask::$password"
          
          Add-Content -Path $env:GITHUB_OUTPUT -Value "USER=$username"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "PASS=$password"
          
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $username -Password $secure
          Add-LocalGroupMember -Group Administrators -Member $username

      - name: Enable RDP with NLA
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 1

      - name: Start bore tunnel and send to Telegram
        shell: pwsh
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          USERNAME: ${{ steps.creds.outputs.USER }}
          PASSWORD: ${{ steps.creds.outputs.PASS }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BOT_TOKEN)) { Write-Host "Missing bot token"; exit 1 }
          if ([string]::IsNullOrWhiteSpace($env:CHANNEL_ID)) { Write-Host "Missing channel ID"; exit 1 }

          Add-MpPreference -ExclusionPath "$PWD\bore" -ErrorAction SilentlyContinue

          Invoke-WebRequest -Uri 'https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-pc-windows-msvc.zip' -OutFile bore.zip -UseBasicParsing
          Expand-Archive bore.zip -DestinationPath ./bore
          $exe = Join-Path $PWD 'bore/bore.exe'

          Start-Process -FilePath $exe -ArgumentList 'local','3389','--to','bore.pub','--port','0' -RedirectStandardOutput "$PWD/bore_out.log" -RedirectStandardError "$PWD/bore_err.log" -NoNewWindow
          Start-Sleep -Seconds 10

          $tunnel = $null
          for ($i = 1; $i -le 12; $i++) {
            if (Test-Path "$PWD\bore_out.log") {
              $log = Get-Content "$PWD\bore_out.log" -Raw
              if ($log -match 'listening at bore\.pub:(\d+)') {
                $port = $matches[1]
                $tunnel = "bore.pub:$port"
                break
              }
            }
            if (Test-Path "$PWD\bore_err.log") {
              $log = Get-Content "$PWD\bore_err.log" -Raw
              if ($log -match 'listening at bore\.pub:(\d+)') {
                $port = $matches[1]
                $tunnel = "bore.pub:$port"
                break
              }
            }
            Start-Sleep -Seconds 5
          }

          if (-not $tunnel) {
            Write-Host "Tunnel not ready. Debug info:"
            if (Test-Path "$PWD\bore_out.log") { Get-Content "$PWD\bore_out.log" }
            if (Test-Path "$PWD\bore_err.log") { Get-Content "$PWD\bore_err.log" }
            exit 1
          }

          # Format message for Telegram
          $message = "🔥 LO Private RDP Ready 🔥`n`n" + `
                     "📍 Address: $tunnel`n" + `
                     "👤 Username: $env:USERNAME`n" + `
                     "🔑 Password: $env:PASSWORD`n`n" + `
                     "⏰ Valid for 6 hours`n" + `
                     "🔒 NLA Enabled - Maximum Security"
          
          # URL encode the message
          $encodedMessage = [System.Web.HttpUtility]::UrlEncode($message)
          Add-Type -AssemblyName System.Web
          
          # Send to Telegram channel
          $telegramUrl = "https://api.telegram.org/bot$env:BOT_TOKEN/sendMessage"
          $body = @{
              chat_id = $env:CHANNEL_ID
              text = $message
              parse_mode = "HTML"
          }
          
          try {
              $response = Invoke-RestMethod -Uri $telegramUrl -Method Post -Body $body -ContentType "application/x-www-form-urlencoded"
              Write-Host "Credentials sent to private Telegram channel successfully."
          } catch {
              Write-Host "Failed to send to Telegram: $_"
              exit 1
          }

          # Keep alive for 6 hours
          for ($i = 0; $i -lt 340; $i++) {
            Start-Sleep -Seconds 60
            if (-not (Get-Process -Name bore -ErrorAction SilentlyContinue)) { Write-Host "bore died, ending."; break }
          }
