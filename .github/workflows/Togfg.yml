name: LO Private APK Builder

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout PRIVATE source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.FG_PAT }}
          fetch-depth: 1
          persist-credentials: false

      - name: Restore keystore (google-services optional)
        shell: bash
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_B64 }}
        run: |
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > ./debug.keystore
          if [ ! -s ./debug.keystore ]; then
            echo "ERROR: debug.keystore empty hai"
            exit 1
          fi
          echo "✅ debug.keystore restored ($(wc -c < ./debug.keystore) bytes)"

          if [ -n "$GOOGLE_SERVICES_B64" ]; then
            echo "$GOOGLE_SERVICES_B64" | base64 -d > ./app/google-services.json
            echo "✅ google-services.json restored"
          else
            echo "ℹ️ Firebase config nahi hai - plugin warn kar ke continue karega"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Debug APK
        env:
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Wipe sensitive files
        shell: bash
        if: always()
        run: |
          rm -f ./debug.keystore ./app/google-services.json
          echo "✅ Sensitive files wiped"

      - name: Send APK to private Discord
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK not found"; exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"

          if [ "$SIZE" -gt 24000000 ]; then
            curl -s -X POST "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"content\":\"LO, APK Discord ki 24MB limit se bara hai. Size: $SIZE bytes\"}"
            exit 1
          fi

          RESP=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$WEBHOOK_URL" \
            -F "payload_json={\"content\":\"LO APK Ready 🔥 (private build)\"}" \
            -F "files[0]=@${APK};filename=lo-private-build.apk")
          echo "Discord response: $RESP"
          if [ "$RESP" != "204" ]; then exit 1; fi
