name: LO Ultra Secure RDP

on:
  workflow_dispatch:

permissions: {}

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Create temporary admin user
        id: pass
        shell: pwsh
        run: |
          $password = -join ((65..90) + (97..122) + (48..57) | Get-Random -Count 20 | ForEach-Object {[char]$_})

          # Mask password everywhere in logs
          Write-Output "::add-mask::$password"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "PASS=$password"

          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name lo_admin -Password $secure
          Add-LocalGroupMember -Group Administrators -Member lo_admin

      - name: Enable RDP with NLA
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 1

      - name: Setup ngrok without exposing token
        shell: pwsh
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NGROK_TOKEN)) {
            Write-Host "Missing ngrok token"
            exit 1
          }

          Invoke-WebRequest -Uri 'https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip' -OutFile ngrok.zip -UseBasicParsing
          Expand-Archive ngrok.zip -DestinationPath ./ngrok

          $config = Join-Path $PWD 'ngrok/ngrok.yml'
          Set-Content -Path $config -Value "authtoken: $env:NGROK_TOKEN"

          $exe = Join-Path $PWD 'ngrok/ngrok.exe'
          Start-Process -FilePath $exe -ArgumentList 'tcp','3389','--config',$config,'--log','stdout' -WindowStyle Hidden

          Start-Sleep -Seconds 20

      - name: Send connection details privately
        shell: pwsh
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          PASS: ${{ steps.pass.outputs.PASS }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WEBHOOK_URL)) {
            Write-Host "Missing webhook"
            exit 1
          }

          $tunnel = $null

          for ($i = 1; $i -le 12; $i++) {
            try {
              $api = Invoke-RestMethod -Uri 'http://127.0.0.1:4040/api/tunnels' -TimeoutSec 10
              $tcp = $api.tunnels | Where-Object { $_.proto -eq 'tcp' } | Select-Object -First 1

              if ($tcp) {
                $tunnel = $tcp.public_url
                break
              }
            } catch {
              Start-Sleep -Seconds 5
            }
          }

          if (-not $tunnel) {
            Write-Host "Tunnel not ready"
            exit 1
          }

          $message = "LO Private RDP Ready`nAddress: $tunnel`nUser: lo_admin`nPassword: $env:PASS"
          $body = @{ content = $message } | ConvertTo-Json

          Invoke-RestMethod -Uri $env:WEBHOOK_URL -Method Post -Body $body -ContentType 'application/json' | Out-Null

          Write-Host "Details sent privately."
