name: LO Ultra Secure RDP (No Card Needed)

on:
  workflow_dispatch:

permissions: {}

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Create temporary admin user
        id: pass
        shell: pwsh
        run: |
          $password = -join ((65..90) + (97..122) + (48..57) | Get-Random -Count 20 | ForEach-Object {[char]$_})
          Write-Output "::add-mask::$password"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "PASS=$password"
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name lo_admin -Password $secure
          Add-LocalGroupMember -Group Administrators -Member lo_admin

      - name: Enable RDP with NLA
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 1

      - name: Start bore tunnel, notify LO, keep alive
        shell: pwsh
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          PASS: ${{ steps.pass.outputs.PASS }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WEBHOOK_URL)) { Write-Host "Missing webhook"; exit 1 }

          Add-MpPreference -ExclusionPath "$PWD\bore" -ErrorAction SilentlyContinue

          # Download bore (a free TCP tunnel tool, no card needed)
          Invoke-WebRequest -Uri 'https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-pc-windows-msvc.zip' -OutFile bore.zip -UseBasicParsing
          Expand-Archive bore.zip -DestinationPath ./bore
          $exe = Join-Path $PWD 'bore/bore.exe'

          # Start bore in background
          Start-Process -FilePath $exe -ArgumentList 'local','3389','--to','bore.pub','--port','0' -RedirectStandardOutput "$PWD/bore_out.log" -RedirectStandardError "$PWD/bore_err.log" -NoNewWindow
          Start-Sleep -Seconds 10

          $tunnel = $null
          for ($i = 1; $i -le 12; $i++) {
            if (Test-Path "$PWD/bore_out.log") {
              $log = Get-Content "$PWD/bore_out.log" -Raw
              if ($log -match 'listening at bore\.pub:(\d+)') {
                $port = $matches[1]
                $tunnel = "bore.pub:$port"
                break
              }
            }
            if (Test-Path "$PWD/bore_err.log") {
              $log = Get-Content "$PWD/bore_err.log" -Raw
              if ($log -match 'listening at bore\.pub:(\d+)') {
                $port = $matches[1]
                $tunnel = "bore.pub:$port"
                break
              }
            }
            Start-Sleep -Seconds 5
          }

          if (-not $tunnel) {
            Write-Host "Tunnel not ready. Debug info:"
            if (Test-Path "$PWD/bore_out.log") { Get-Content "$PWD/bore_out.log" }
            if (Test-Path "$PWD/bore_err.log") { Get-Content "$PWD/bore_err.log" }
            exit 1
          }

          $message = "LO Private RDP Ready`nAddress: $tunnel`nUser: lo_admin`nPassword: $env:PASS"
          $body = @{ content = $message } | ConvertTo-Json
          Invoke-RestMethod -Uri $env:WEBHOOK_URL -Method Post -Body $body -ContentType 'application/json' | Out-Null
          Write-Host "Details sent privately."

          # Keep alive for 6 hours
          for ($i = 0; $i -lt 340; $i++) {
            Start-Sleep -Seconds 60
            if (-not (Get-Process -Name bore -ErrorAction SilentlyContinue)) { Write-Host "bore died, ending."; break }
          }
